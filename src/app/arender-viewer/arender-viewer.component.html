<adf-alfresco-viewer [showViewer]="true" [overlayMode]="true" [nodeId]="nodeId" [allowRightSidebar]="true"
  [showRightSidebar]="false" (showViewerChange)="onVisibilityChanged($event)">

  <adf-viewer-toolbar-actions>
    <ng-content select="arender-viewer-toolbar-actions"></ng-content>
  </adf-viewer-toolbar-actions>

  <adf-viewer-sidebar>
    <ng-content select="arender-viewer-extra-sidebar"></ng-content>
  </adf-viewer-sidebar>

  <arender-viewer-extension [supportedExtensions]="['custom']">
    <ng-template>
      <div class="adf-viewer-layout-content adf-viewer__fullscreen-container">
        <ng-container *ngIf="safeURL">
          <iframe class="full-window" title="" [src]="safeURL" allowfullscreen></iframe>
        </ng-container>
      </div>
    </ng-template>
  </arender-viewer-extension>
</adf-alfresco-viewer>
